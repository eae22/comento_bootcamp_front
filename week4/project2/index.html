<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project#2 회원가입</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Project#2 회원가입</h1>
        <p class="app__subtitle">아이디 중복 체크 + 비밀번호 규칙 검증</p>
      </header>
      <!-- 회원가입 입력 영역 -->
      <section class="card" aria-label="회원가입 입력">
        <form class="form js-signup-form">
          <!-- 아이디 -->
          <div class="form__row">
            <label class="form__label" for="user-id">아이디</label>
            <input
              id="user-id"
              class="form__input js-id"
              type="text"
              placeholder="예: abc1234"
              maxlength="12"
              required
              autocomplete="username"
            />
            <button class="btn js-check-btn" type="button">중복확인</button>
          </div>
          <p class="hint js-id-hint"></p>
          <!-- 비밀번호 -->
          <div class="form__row form__row--pw">
            <label class="form__label" for="user-pw">비밀번호</label>
            <div class="input-with-btn">
              <input
                id="user-pw"
                class="form__input js-pw"
                type="password"
                placeholder="비밀번호를 입력하세요"
                maxlength="30"
                required
                autocomplete="new-password"
              />
              <button class="btn btn--ghost js-toggle-pw" type="button" aria-pressed="false">보기</button>
            </div>
          </div>
          <!-- 비밀번호 규칙 안내 -->
          <p class="hint hint--rule">* 8자 이상의 비밀번호로, 대문자/숫자/특수문자를 각각 1개 이상 포함해야 합니다.</p>
          <!-- 비밀번호 규칙 검증 결과 -->
          <p class="hint js-pw-hint"></p>
          <!-- 비밀번호 확인 -->
          <div class="form__row form__row--pw">
            <label class="form__label" for="user-pw2">비밀번호 확인</label>
            <div class="input-with-btn">
              <input
                id="user-pw2"
                class="form__input js-pw2"
                type="password"
                placeholder="비밀번호를 다시 입력하세요"
                maxlength="30"
                required
                autocomplete="new-password"
              />
              <button class="btn btn--ghost js-toggle-pw2" type="button" aria-pressed="false">보기</button>
            </div>
          </div>
          <!-- 비밀번호 확인 결과 -->
          <p class="hint js-pw2-hint"></p>
          <!-- 안내/에러 메시지 -->
          <p class="msg js-msg"></p>
          <div class="form__actions">
            <button class="btn btn--primary js-submit-btn" type="submit">회원가입</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
